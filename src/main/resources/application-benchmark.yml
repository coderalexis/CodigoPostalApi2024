spring:
  config:
    activate:
      on-profile: benchmark
server:
  address: 127.0.0.1
  forward-headers-strategy: none
ratelimit:
  enabled: false
cache:
  warmup:
    enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    root: WARN
    com.coderalexis.CodigoPostalApi: WARN
